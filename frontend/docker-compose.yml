services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawasena-fe
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host --force

volumes:
  frontend_node_modules: